name: "Bug Report"
description: "File a structured bug report or scanner defect for DevPortal."
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please provide as much detail as possible.
  - type: input
    id: version
    attributes:
      label: DevPortal Version
      description: What GVS version of DevPortal are you running? (e.g., 2605.4.2-bs)
      placeholder: 2605.4.2-bs
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - macOS (Apple Silicon arm64)
        - macOS (Intel x86_64)
        - Linux
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: When scanning directories containing...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the issue.
      placeholder: |
        1. Add watch directory '...' in Settings
        2. Refresh dashboard
        3. See error
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error Logs or Terminal Output
      description: Paste any relevant logs from `storage/logs/laravel.log` or browser devtools console.
      render: shell
